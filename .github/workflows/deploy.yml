name: Deploy Aetherfall to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build Unified Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Full Quality & Gameplay Validation Test Suites
        run: bash tests/run.sh

      - name: Build Unified Production Bundle & Standalone Executables
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          echo "Verifying build outputs..."
          ls -la dist/
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -f dist/Aetherfall-v0.9.exe
          test -f dist/Aetherfall-v0.9-Windows.zip

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to gh-pages branch (Automatic Branch Publishing)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          enable_jekyll: false

  deploy-pages:
    name: Deploy to GitHub Pages (Actions Target)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
